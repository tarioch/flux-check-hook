repos:
- repo: meta
  hooks:
  - id: check-hooks-apply
  - id: check-useless-excludes

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: check-added-large-files
  - id: check-ast
  - id: check-json
  - id: check-merge-conflict
  - id: check-toml
  - id: check-yaml
    exclude: '^tests/fixtures/chart/templates/'  # helm templates are not yaml
  - id: debug-statements
  - id: end-of-file-fixer
  - id: mixed-line-ending
    args: ['--fix=auto']  # replace 'auto' with 'lf' to enforce Linux/Mac line endings or 'crlf' for Windows

- repo: https://github.com/pre-commit/pre-commit
  rev: v4.6.2
  hooks:
  - id: validate_manifest

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.8
  hooks:
    - id: ruff-check
    - id: ruff-format

- repo: local
  hooks:
  - id: mypy
    name: mypy
    # runs in the project environment to see the types of the installed packages, mypy and its stubs are dev dependencies
    entry: uv run --locked mypy src tests
    language: system
    types: [python]
    pass_filenames: false

- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.12.17
  hooks:
    - id: uv-lock

- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.30.1
  hooks:
    - id: zizmor
